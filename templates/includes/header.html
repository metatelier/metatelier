{% load static %}
<!-- Header Navigation -->
<header class="header" id="main-header">
    <div class="header-container">
        <div class="brand-box">
            <a href="/" id="brand-logo-text" class="logo" style="display: flex; align-items: center; gap: 8px;">
                <img src="{% static 'logo.png' %}?v=2" alt="Logo" style="height: 35px; width: auto;">
                {{CONF_WEB.title_one}}
            </a>
            <span id="txt-header-sublogo" class="sub-logo">{{CONF_WEB.sub_title}}</span>
        </div>
        
        <div class="header-actions">
            <button id="btn-admin-lock" class="icon-btn" aria-label="Admin" title="Acceso Administrativo">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            </button>
            <button id="btn-buscar-toggle" class="icon-btn" aria-label="Buscar">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            </button>
            <button id="btn-abrir-bolsa" class="cart-btn" aria-label="Bolsa de Compras">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
                <span id="cart-count" class="cart-count">0</span>
            </button>
        </div>
    </div>

    <!-- Barra de Búsqueda Desplegable -->
    <div id="search-bar" class="search-bar-container">
        <input type="text" id="input-busqueda" placeholder="Buscar por nombre, material o categoría (ej. Becerro, Noche)...">
        <button id="btn-cerrar-busqueda">&times;</button>
    </div>
</header>
